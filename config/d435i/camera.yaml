# =====================================================================
# RealSense D435i 双目红外相机内参（VINS-Fusion 使用 infra1/infra2）
# 获取方式（二选一）：
#   1) 出厂标定：rs-sensor-control  ->  "Stereo Module" -> 内参
#   2) 复标：kalibr（见 docs/04）
# 单位：像素；模型 PINHOLE（pinhole + radtan 畸变）
# =====================================================================
model_type: PINHOLE
camera_name: d435i_infra

image_width: 848
image_height: 480

# 左目 (infra1) 内参
cam0:
  fx: 426.0
  fy: 426.0
  cx: 424.0
  cy: 240.0
  distortion: [0.0, 0.0, 0.0, 0.0]   # k1 k2 p1 p2

# 右目 (infra2) 内参
cam1:
  fx: 426.0
  fy: 426.0
  cx: 424.0
  cy: 240.0
  distortion: [0.0, 0.0, 0.0, 0.0]

# 双目基线（米，出厂标定 "Stereo Extrinsics" -> baseline）
baseline: 0.050
