# =====================================================================
# RealSense D435i IMU（BMI055）噪声参数，供 VINS-Fusion 与 kalibr 使用
# 获取方式：imu_utils 标定（见 docs/04），或先用出厂典型值
# =====================================================================
# 陀螺仪
gyr_n: 0.001          # 陀螺噪声密度  (rad/s)/sqrt(Hz)
gyr_w: 0.00001        # 陀螺随机游走  (rad/s^2)/sqrt(Hz)

# 加速度计
acc_n: 0.01           # 加速度噪声密度 (m/s^2)/sqrt(Hz)
acc_w: 0.0001         # 加速度随机游走 (m/s^3)/sqrt(Hz)

# IMU 采样率
imu_rate: 400         # Hz
